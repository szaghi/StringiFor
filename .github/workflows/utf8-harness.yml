name: UTF-8 harness

# Project-owned workflow (not managed by `fobis scaffold`), issue #51: the generated Unicode tables must be what the
# pinned UCD gives, their lookup must agree with an independent reading of the UCD on every codepoint, and the oracle
# suites must have no mismatch.

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  utf8-harness:
    name: utf8 harness / gfortran-14
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        gcc-version: '14'

    - name: Fetch dependencies
      run: fobis fetch

    - name: Check the corpus
      run: python3 -I scripts/utf8/corpus.py --self-test

    - name: Check the generated Unicode tables against the pinned UCD
      run: python3 -I scripts/utf8/gen_unicode_tables.py --check

    - name: Build the library and the harness drivers
      run: bash scripts/utf8/build.sh

    - name: Check the table lookup on every codepoint
      run: python3 -I scripts/utf8/gen_unicode_tables.py --check-driver build/utf8/gfortran/bin/check_tables

    - name: Run the oracle suites
      run: |
        bash scripts/oracle.sh invariant
        bash scripts/oracle.sh invariant --self-test
        bash scripts/oracle.sh utf8
        bash scripts/oracle.sh escape
        bash scripts/oracle.sh units
        bash scripts/oracle.sh positions
        bash scripts/oracle.sh columns
        bash scripts/oracle.sh xml
        bash scripts/oracle.sh whitespace
