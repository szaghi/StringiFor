name: Docs examples

# Project-owned workflow (not managed by `fobis scaffold`): the programs of docs/examples are built and run, and
# their snippets, outputs and images regenerated; the committed ones, included by the documentation, must match
# what the code produces.

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  docs-examples:
    name: docs examples / gfortran-16.2
    runs-on: ubuntu-latest
    # the toolchain image of ci.yml: gfortran 13.3 and 14.2 (Ubuntu 24.04's) end a list-directed read into a string
    # (read_stdin) with "End of file"; 14.3 and 16.2 read it; the supported compilers are in docs/guide/installation.md
    container: ghcr.io/szaghi/fortran-toolchains:gnu-16.2

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch dependencies
      run: fobis fetch

    - name: Build and run the examples
      run: bash scripts/docs_examples.sh

    - name: Check the committed snippets, outputs and images
      run: |
        git add --intent-to-add docs/examples
        git diff --exit-code -- docs/examples || {
          echo "::error::docs/examples is out of date: run 'bash scripts/docs_examples.sh' and commit the result"
          exit 1
        }
